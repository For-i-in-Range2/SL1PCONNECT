# SL1PCONNECT – Zone B : Docker Swarm (2 nœuds) + reverse-proxy externe
#
# Architecture :
#   VM1 (manager)     : db-velvet, Grafana          [interne, jamais exposé direct]
#   VM2 (worker)      : thread-api (x2), tailor-panel, stitch-processor (x2)
#   VM3 (hors Swarm)  : Traefik, en DMZ              [voir ./reverse-proxy/]
#
#   VM3 ne fait PAS partie du cluster Swarm et n'a aucun accès à l'API
#   Docker/Swarm (isolation totale). Elle route le trafic vers VM1/VM2 via
#   le routing mesh Swarm : un port publié (ports: ci-dessous) est joignable
#   sur N'IMPORTE QUEL nœud du cluster, qui relaie en interne vers le
#   conteneur réel, même s'il tourne sur l'autre nœud. C'est ce qui permet à
#   VM3 de ne connaître QUE les IP de VM1/VM2 + un port, sans jamais savoir
#   où les conteneurs sont réellement placés.
#
# Avant de déployer :
#   1. docker swarm init           (sur VM1)
#   2. docker swarm join ...       (sur VM2)
#   3. Créer les secrets           (voir deploy.sh)
#   4. Builder et pousser images   (voir build.sh)
#   5. docker stack deploy -c docker-stack.yml sl1p
#   6. Configurer et lancer le reverse-proxy sur VM3 (voir ./reverse-proxy/)
#
# IMPORTANT : build: n'existe pas en Swarm.
#             Les images doivent être dans le registry local (VM1:5000)

# ── Secrets (créés via docker secret create, jamais dans ce fichier) ──────
secrets:
  db_password:
    external: true
  jwt_secret:
    external: true
  grafana_admin_password:
    external: true

# ── Configs (fichiers de config injectés dans les conteneurs) ─────────────
configs:
  db_init_sql:
    file: ./db-velvet/init.sql

# ── Réseaux overlay (chiffrement inter-nœuds) ────────────────────────────
# net-front et net-proxy ont disparu : ils ne servaient qu'à la connectivité
# Traefik <-> socket-proxy <-> services, désormais hors Swarm (VM3).
networks:
  net-api:
    driver: overlay
    driver_opts:
      encrypted: "true"
  net-data:
    driver: overlay
    driver_opts:
      encrypted: "true"
  net-monitoring:
    driver: overlay
    driver_opts:
      encrypted: "true"

volumes:
  velvet-data:
  grafana-data:

# ── Services ──────────────────────────────────────────────────────────────
# Le reverse-proxy (Traefik) ne fait plus partie du Swarm : voir ./reverse-proxy/
# Il route vers les services ci-dessous via les ports publiés (routing mesh).
services:

  # ── Base de données (nœud manager, données persistantes) ──────────────
  db-velvet:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: velvet
      POSTGRES_DB: velvet
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    configs:
      - source: db_init_sql
        target: /docker-entrypoint-initdb.d/init.sql
        mode: 0444
    volumes:
      - velvet-data:/var/lib/postgresql/data
    networks:
      - net-data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velvet"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager    # volume local → toujours sur le manager
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
      restart_policy:
        condition: on-failure
      update_config:
        order: stop-first           # postgres ne supporte pas le rolling update

  # ── API Flask (x2 réplicas, répartis sur les 2 nœuds) ────────────────
  thread-api:
    image: ${REGISTRY:-127.0.0.1:5000}/sl1p/thread-api:${IMAGE_TAG:-latest}
    secrets:
      - db_password
      - jwt_secret
    environment:
      DB_HOST: db-velvet
      DB_NAME: velvet
      DB_USER: velvet
      PORT: "8080"
    ports:
      # Routing mesh : joignable sur le port 8080 de N'IMPORTE QUEL nœud Swarm
      - target: 8080
        published: 8080
        protocol: tcp
        mode: ingress
    networks:
      - net-api
      - net-data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 2
      placement:
        preferences:
          - spread: node.id         # 1 réplica par nœud si possible
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first          # zero-downtime rolling update

  # ── Panel PHP (nœud worker) ───────────────────────────────────────────
  tailor-panel:
    image: ${REGISTRY:-127.0.0.1:5000}/sl1p/tailor-panel:${IMAGE_TAG:-latest}
    secrets:
      - db_password
    environment:
      DB_HOST: db-velvet
      DB_NAME: velvet
      DB_USER: velvet
    ports:
      # Routing mesh : joignable sur le port 8081 de N'IMPORTE QUEL nœud Swarm
      - target: 80
        published: 8081
        protocol: tcp
        mode: ingress
    networks:
      - net-data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/index.php?health=1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first

  # ── Processeur IoT (x2 réplicas) ─────────────────────────────────────
  stitch-processor:
    image: ${REGISTRY:-127.0.0.1:5000}/sl1p/stitch-processor:${IMAGE_TAG:-latest}
    secrets:
      - db_password
    environment:
      DB_HOST: db-velvet
      DB_NAME: velvet
      DB_USER: velvet
      PORT: "8082"
    networks:
      - net-api
      - net-data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 2
      placement:
        preferences:
          - spread: node.id
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first

  # ── Grafana (nœud manager) ────────────────────────────────────────────
  fabric-watch:
    image: grafana/grafana:11.4.0
    user: "472:472"
    secrets:
      - grafana_admin_password
    environment:
      GF_SECURITY_ADMIN_USER: sl1padmin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      # Routing mesh : joignable sur le port 9090 de N'IMPORTE QUEL nœud Swarm
      - target: 3000
        published: 9090
        protocol: tcp
        mode: ingress
    networks:
      - net-monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
      restart_policy:
        condition: on-failure
