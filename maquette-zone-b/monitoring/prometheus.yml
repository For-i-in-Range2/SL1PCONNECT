###############################################################################
# Prometheus — Configuration scraping
# SL1PCONNECT Zone B IoT
###############################################################################

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    zone: "zone-b-iot"
    env: "prod"

# ── Règles d'alertes ─────────────────────────────────────────────────────────
rule_files:
  - /etc/prometheus/rules/*.yml

# ── Alertmanager ─────────────────────────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# ── Scrape configs ────────────────────────────────────────────────────────────
scrape_configs:

  # Prometheus lui-même
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9091"]

  # fabric-watch — métriques IoT métier
  - job_name: "fabric-watch"
    static_configs:
      - targets: ["fabric-watch:9090"]
    scrape_interval: 10s
    metrics_path: /metrics

  # thread-api
  - job_name: "thread-api"
    static_configs:
      - targets: ["thread-api:8080"]
    metrics_path: /metrics

  # stitch-processor
  - job_name: "stitch-processor"
    static_configs:
      - targets: ["stitch-processor:8082"]
    metrics_path: /metrics

  # Traefik
  - job_name: "traefik"
    static_configs:
      - targets: ["traefik:8899"]

  # PostgreSQL (via postgres_exporter)
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # cAdvisor — métriques conteneurs
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
    scrape_interval: 15s

  # Loki
  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]
    metrics_path: /metrics
