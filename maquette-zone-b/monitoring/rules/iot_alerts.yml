###############################################################################
# Règles d'alertes Prometheus — SL1PCONNECT IoT
###############################################################################

groups:
  - name: services_iot
    interval: 30s
    rules:

      # Service down
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} hors ligne"
          description: "Le service {{ $labels.job }} ne répond plus depuis 2 minutes."

      # Latence API élevée (p95 > 2s)
      - alert: HighApiLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Latence élevée sur {{ $labels.job }}"
          description: "P95 latence = {{ $value | humanizeDuration }}"

      # Taux d'erreur HTTP > 5%
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Taux d'erreur élevé sur {{ $labels.job }}"
          description: "Taux d'erreur 5xx = {{ $value | humanizePercentage }}"

  - name: infrastructure
    rules:

      # Disque > 80%
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Espace disque faible sur {{ $labels.instance }}"
          description: "Moins de 20% d'espace libre sur {{ $labels.mountpoint }}"

      # RAM > 90%
      - alert: HighMemoryUsage
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Mémoire élevée sur {{ $labels.instance }}"
          description: "Utilisation RAM = {{ $value | humanizePercentage }}"

      # CPU > 85% pendant 10 minutes
      - alert: HighCpuUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU élevé sur {{ $labels.instance }}"

      # Conteneur redémarré récemment
      - alert: ContainerRestarted
        expr: increase(container_restart_count_total[1h]) > 3
        labels:
          severity: warning
        annotations:
          summary: "Conteneur {{ $labels.name }} redémarré {{ $value }} fois en 1h"

  - name: database
    rules:

      # PostgreSQL trop de connexions (> 80% du max)
      - alert: PostgresHighConnections
        expr: pg_stat_activity_count / pg_settings_max_connections > 0.80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Connexions PostgreSQL proches du maximum"
