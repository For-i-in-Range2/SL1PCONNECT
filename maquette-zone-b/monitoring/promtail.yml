###############################################################################
# Promtail — Agent de collecte de logs
###############################################################################

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # Logs des conteneurs Docker (via fichiers, pas docker.sock)
  - job_name: docker-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            time: time
            attrs: attrs
      - json:
          source: attrs
          expressions:
            tag: "com.docker.compose.service"
      - labels:
          service: tag
          stream: stream
      - timestamp:
          source: time
          format: RFC3339Nano
      - output:
          source: log

  # Logs système
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          host: iot-host
          __path__: /var/log/syslog
