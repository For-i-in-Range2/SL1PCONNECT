###############################################################################
# Traefik v3 — Configuration statique
# SL1PCONNECT Zone B IoT
###############################################################################

global:
  checkNewVersion: false      # Ne pas contacter les serveurs Traefik
  sendAnonymousUsage: false

# ── Entrypoints ──────────────────────────────────────────────────────────────
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
        options: secureTLS
      middlewares:
        - security-headers@file
        - rate-limit@file

# ── TLS ──────────────────────────────────────────────────────────────────────
tls:
  options:
    secureTLS:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
      sniStrict: true

# ── Certificate resolvers (Let's Encrypt) ────────────────────────────────────
certificatesResolvers:
  letsencrypt:
    acme:
      email: ops@slipconnect.com
      storage: /certs/acme.json
      tlsChallenge: {}

# ── Providers ─────────────────────────────────────────────────────────────────
providers:
  # Provider fichier pour la configuration dynamique (pas de docker.sock !)
  file:
    directory: /etc/traefik/config
    watch: true

# ── API / Dashboard ───────────────────────────────────────────────────────────
api:
  dashboard: true
  insecure: false             # Dashboard uniquement via HTTPS + auth

# ── Logs ──────────────────────────────────────────────────────────────────────
log:
  level: WARN                 # ERROR en prod, DEBUG en dev
  format: json

accessLog:
  format: json
  fields:
    headers:
      defaultMode: drop       # Ne pas logger les headers (RGPD)
      names:
        X-Request-Id: keep

# ── Métriques Prometheus ──────────────────────────────────────────────────────
metrics:
  prometheus:
    addEntryPointsLabels: true
    addServicesLabels: true
    entryPoint: metrics
    buckets: [0.1, 0.3, 1.2, 5.0]

entryPoints:
  metrics:
    address: ":8899"          # Scrape interne uniquement
